name: CI

# Build/test gate for PRs targeting main. Mirrors the prep steps from
# release.yml (lint, test, build, backend bundle) so a PR that wouldn't ship
# a release can't merge — catches regressions like missing esbuild alias
# entries before they reach main. `pnpm test` is the fast unit+API tier
# (~30s, no booted stack); e2e stays a manual post-push confirmation, not a
# merge gate.
#
# This reacts only to code changes (opened/synchronize/reopened) — NOT to
# label events. The release: label requirement lives in its own workflow
# (release-label.yml) because it must react to `labeled`/`unlabeled`, which
# this job doesn't care about. Splitting them keeps every run internally
# consistent: a build run never has a skipped job, and a label run never
# re-runs the build. (Previously both jobs shared one workflow with a label
# trigger, so the first `opened` run and the later `labeled` run each carried
# one green + one failed/skipped job — the checks were green only across two
# runs, never within one.)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Bundle backend
        run: pnpm --filter @vspark/backend bundle
